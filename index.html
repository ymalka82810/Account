<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2b4f">
<title>הקופה המשפחתית</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- טעינה / אין שרת -->
<section id="screen-loading" class="screen center active">
  <div class="big-emoji" aria-hidden="true">🪙</div>
  <p>רגע, מתחברים…</p>
</section>

<section id="screen-noserver" class="screen center">
  <div class="big-emoji" aria-hidden="true">🔌</div>
  <h1>האפליקציה עוד לא מחוברת לשרת</h1>
  <p class="hint">הורה צריך להגדיר את כתובת Convex בקובץ <code>config.js</code>.</p>
</section>

<!-- מסכי הכניסה (welcome/setup/login/join/pin) מצוירים ע"י React: src-react/components/Auth.jsx -->
<section id="screen-welcome" class="screen"></section>

<!-- הקמת משפחה חדשה (להורים) -->
<section id="screen-setup" class="screen"></section>

<!-- בחירת מי נכנס -->
<section id="screen-login" class="screen center"></section>

<!-- הצטרפות עם קוד -->
<section id="screen-join" class="screen"></section>

<!-- קוד סודי -->
<section id="screen-pin" class="screen center"></section>

<!-- האפליקציה -->
<section id="screen-app" class="screen">
  <header class="top">
    <div class="who-am-i">
      <span id="meAvatar" class="avatar-sm" aria-hidden="true"></span>
      <div>
        <h1 id="meName"></h1>
        <p id="familyName" class="sub">הקופה המשפחתית</p>
      </div>
    </div>
    <button id="logoutBtn" class="ghost light" type="button">יציאה</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="תפריט ראשי">
    <button role="tab" class="tab active" data-tab="home" aria-selected="true">🏠 הכסף שלי</button>
    <button role="tab" class="tab teen-only" data-tab="friends" aria-selected="false" hidden>🤝 חברים</button>
    <button role="tab" class="tab" data-tab="history" aria-selected="false">📜 מה היה</button>
    <button role="tab" class="tab parent-only" data-tab="family" aria-selected="false" hidden>👨‍👩‍👧 המשפחה</button>
  </nav>

  <main>
    <section id="tab-home" class="panel active">
      <!-- התוכן מכאן מנוהל ע"י React (ראו src-react/mountHome.jsx) -->
      <div id="reactHomeRoot"></div>

      <button id="pushBtn" class="ghost linkish" type="button" hidden>🔔 הפעלת התראות</button>
      <button id="teenRequestBtn" class="ghost linkish" type="button" hidden>🎧 בקשה להפוך לנער/ה</button>
      <button id="changePinBtn" class="ghost linkish" type="button">🔑 שינוי הקוד הסודי שלי</button>
      <button id="emailBtn" class="ghost linkish parent-only" type="button">✉️ הוספת מייל לשחזור קוד</button>
    </section>

    <section id="tab-friends" class="panel">
      <!-- מנוהל ע"י React (src-react/components/FriendsTab.jsx) -->
      <div id="friendsRoot"></div>
    </section>

    <section id="tab-history" class="panel">
      <div id="myHistory"></div>
    </section>

    <section id="tab-family" class="panel">
      <div id="pendingBoxParent"></div>
      <div id="legacyBox"></div>
      <div id="codesBox"></div>
      <h2>יתרות</h2>
      <div id="balances" class="balances"></div>
      <h2>כל החובות הפתוחים</h2>
      <div id="debts"></div>

      <h2>דמי כיס קבועים</h2>
      <p class="hint">רישום חוב אוטומטי, שבועי או חודשי, בלי להקליד כל פעם.</p>
      <div id="recurringBox"></div>

      <div id="teenFriendsRoot"></div>

      <h2>בני המשפחה</h2>
      <div id="peopleList"></div>
      <form id="personForm" class="form card" autocomplete="off">
        <h3>הוספת בן/בת משפחה</h3>
        <label class="field"><span>שם</span><input id="personName" type="text" maxlength="20" required></label>
        <label class="field"><span>תפקיד</span>
          <select id="personRole"><option value="child">ילד/ה</option><option value="teen">נער/ה</option><option value="parent">הורה</option></select></label>
        <div class="field"><span>דמות</span><div id="personAvatars" class="avatars"></div></div>
        <label class="field"><span>קוד סודי (לא חובה — אפשר שהילד/ה יבחרו לבד)</span>
          <input id="personPin" type="password" inputmode="numeric" pattern="\d{4}" maxlength="4" autocomplete="new-password"></label>
        <button class="primary" type="submit">הוספה</button>
      </form>

      <h2>כל הרשומות</h2>
      <div id="allHistory"></div>
      <div class="tools">
        <button class="ghost" id="exportBtn" type="button">שמירת גיבוי</button>
        <label class="ghost filebtn">הוספה מקובץ גיבוי<input type="file" id="importFile" accept="application/json" hidden></label>
      </div>
      <div class="tools">
        <button class="ghost" id="renameFamilyBtn" type="button">שינוי שם המשפחה</button>
        <button class="ghost danger-ghost" id="deleteFamilyBtn" type="button">מחיקת הקופה כולה</button>
      </div>
    </section>
    <p class="legal"><a href="terms.html">תנאי שימוש</a> · <a href="privacy.html">מדיניות פרטיות</a></p>
  </main>
</section>

<!-- חלון קופץ -->
<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button id="sheetClose" class="ghost" type="button" aria-label="סגירה">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="vendor/convex-browser.bundle.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
