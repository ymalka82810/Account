name: Deploy React app to GitHub Pages

# שימו לב: ה-trigger היחיד כרגע הוא הפעלה ידנית (workflow_dispatch).
# זה מכוון: כל עוד GitHub Pages מוגדר ב-Settings > Pages על "Deploy from a branch"
# (מגיש את index.html הישן ישירות מה-root), ה-workflow הזה לא מתחרה איתו ולא
# רץ אוטומטית. רק כש-React יהיה מוכן להחליף את האתר הישן, נוסיף "on: push"
# ונעבור ידנית ב-Settings > Pages ל-Source: "GitHub Actions".

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
