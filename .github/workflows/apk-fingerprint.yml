name: APK signing fingerprint (SHA-256 only)

on:
  workflow_dispatch:

jobs:
  fp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # מדפיס רק את טביעת האצבע הציבורית של תעודת החתימה (נדרשת ל-assetlinks.json), לא את הסיסמה ולא את המפתח
      - name: Print certificate SHA-256
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.p12
          FP=$(keytool -list -v -keystore $RUNNER_TEMP/release.p12 -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          rm -f $RUNNER_TEMP/release.p12
          echo "::notice title=SHA256::$FP"
