name: Build Android APK

# בונה APK חתום ומפרסם אותו כ-GitHub Release (tag: v1.0.<מספר ריצה>). האפליקציה בודקת Releases
# ומציעה למשתמש לעדכן. מספר הריצה הוא גם ה-versionCode, כי העדכון משווה לפיו.
# הפעלה: Actions > Build Android APK > Run workflow.
# נדרשים Secrets: KEYSTORE_B64 (קובץ p12 ב-base64) ו-KEYSTORE_PASSWORD. לא חובה: GOOGLE_SERVICES_JSON (להתראות). אותו מפתח בכל גרסה, אחרת אנדרואיד יסרב לעדכן.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: com.ymalka.account
  VERSION_CODE: ${{ github.run_number }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          APK_BUILD: "1"
      - run: npx cap add android
      - run: npx cap sync android

      # התראות (FCM): הסוד GOOGLE_SERVICES_JSON הוא תוכן קובץ google-services.json מ-Firebase (אפליקציית Android עם com.ymalka.account).
      # תבנית Capacitor מפעילה את תוסף google-services מעצמה כשהקובץ קיים. בלי הסוד ההתראות כבויות באפליקציה (FCM_ENABLED=false),
      # כי בלי Firebase הרישום להתראות נתקע או מקריס. הרשאת POST_NOTIFICATIONS נדרשת באנדרואיד 13+ כדי שבקשת ההרשאה תוצג בכלל.
      - name: Firebase (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $MANIFEST
          grep -q android.permission.POST_NOTIFICATIONS $MANIFEST
          CONFIG=android/app/src/main/assets/public/config.js
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            python3 -c "import json; d=json.load(open('android/app/google-services.json')); assert any(c['client_info']['android_client_info']['package_name']=='$APP_ID' for c in d['client']), 'google-services.json is not for $APP_ID'"
            sed -i 's/window.FCM_ENABLED = [a-z]*;/window.FCM_ENABLED = true;/' $CONFIG
            grep -q 'window.FCM_ENABLED = true;' $CONFIG
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is missing - push notifications are disabled in this APK"
            sed -i 's/window.FCM_ENABLED = [a-z]*;/window.FCM_ENABLED = false;/' $CONFIG
            grep -q 'window.FCM_ENABLED = false;' $CONFIG
          fi

      # @capacitor/assets@3 תלוי ב-sharp@0.32, שמוריד את libvips מ-GitHub Releases בזמן ההתקנה. כשההורדה נכשלת (504)
      # npx בולע את השגיאה ויוצא עם 1 בלי שום פלט. sharp@0.33 מגיע עם הקבצים הבינאריים כחבילות npm רגילות,
      # לכן מתקינים את הכלי בנפרד עם override, וכל כשל התקנה יהיה גלוי.
      - name: Generate app icons
        run: |
          mkdir /tmp/capa
          (cd /tmp/capa && npm init -y >/dev/null && npm pkg set overrides.sharp=0.33.5 && npm i @capacitor/assets@3 --no-audit --no-fund)
          node /tmp/capa/node_modules/@capacitor/assets/bin/capacitor-assets generate --android --assetPath assets

      # אייקון לפי מטבע: activity-alias לכל מטבע (₪, $, €...) במקום ה-LAUNCHER של MainActivity
      - name: Currency launcher icons
        run: python3 android-plugin/apply-currency-icons.py

      - name: Add native plugins (self-update, biometric, app icon)
        run: |
          JAVA_DIR=android/app/src/main/java/com/ymalka/account
          sed "s/PACKAGE_PLACEHOLDER/com.ymalka.account/" android-plugin/AppUpdaterPlugin.java > $JAVA_DIR/AppUpdaterPlugin.java
          sed "s/PACKAGE_PLACEHOLDER/com.ymalka.account/" android-plugin/BiometricAuthPlugin.java > $JAVA_DIR/BiometricAuthPlugin.java
          sed "s/PACKAGE_PLACEHOLDER/com.ymalka.account/" android-plugin/AppIconPlugin.java > $JAVA_DIR/AppIconPlugin.java
          # רישום הפלאגינים לפני super.onCreate
          sed -i 's/public class MainActivity extends BridgeActivity {}/public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(AppUpdaterPlugin.class);\n        registerPlugin(BiometricAuthPlugin.class);\n        registerPlugin(AppIconPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}/' $JAVA_DIR/MainActivity.java
          grep -q "registerPlugin(BiometricAuthPlugin.class)" $JAVA_DIR/MainActivity.java
          grep -q "registerPlugin(AppIconPlugin.class)" $JAVA_DIR/MainActivity.java
          # ספריית BiometricPrompt של androidx
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.biometric:biometric:1.1.0"/' android/app/build.gradle
          grep -q "androidx.biometric:biometric" android/app/build.gradle
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # אזור הסטטוס (מצלמה/שעון/סוללה): ה-WebView מרופד מתחתיו (SystemBars native), והרקע שמאחורי הרפידה שחור
          sed -i 's#<item name="android:background">@null</item>#<item name="android:background">@null</item>\n        <item name="android:windowBackground">@android:color/black</item>#' android/app/src/main/res/values/styles.xml
          grep -q "android:windowBackground" android/app/src/main/res/values/styles.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' $MANIFEST
          # רטט כשסכום משתנה (navigator.vibrate ב-WebView דורש את ההרשאה)
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' $MANIFEST
          grep -q android.permission.VIBRATE $MANIFEST
          # Android App Links: קישור ymalka82810.github.io/Account/... נפתח באפליקציה (assetlinks.json בריפו ymalka82810.github.io)
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          f = ('        <intent-filter android:autoVerify="true">\n'
               '            <action android:name="android.intent.action.VIEW" />\n'
               '            <category android:name="android.intent.category.DEFAULT" />\n'
               '            <category android:name="android.intent.category.BROWSABLE" />\n'
               '            <data android:scheme="https" android:host="ymalka82810.github.io" android:pathPrefix="/Account" />\n'
               '        </intent-filter>\n')
          i = s.index('</activity>')
          open(p, 'w', encoding='utf-8').write(s[:i] + f + '        ' + s[i:])
          PY
          grep -q 'android:autoVerify="true"' $MANIFEST
          grep -q fileprovider $MANIFEST
          grep -q app_update android/app/src/main/res/xml/file_paths.xml || \
            sed -i 's#</paths>#    <external-files-path name="app_update" path="app-update/" />\n</paths>#' android/app/src/main/res/xml/file_paths.xml
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/; s/versionName \"1.0\"/versionName \"1.0.$VERSION_CODE\"/" android/app/build.gradle
          grep -q "versionCode $VERSION_CODE" android/app/build.gradle

      # שמירת Gradle בין בניות: ההורדות (Gradle עצמו, ספריות אנדרואיד) ותוצרי בנייה שלא השתנו.
      # המפתח לפי package-lock.json, כי גרסת Capacitor קובעת את גרסת Gradle והספריות.
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android-plugin/**', '.github/workflows/build-apk.yml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Speed up Gradle
        run: |
          # בלי בדיקות lint בבניית release (הן לוקחות הרבה מזמן הבנייה ולא חוסמות כלום אצלנו)
          printf '\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> android/app/build.gradle
          printf '\norg.gradle.caching=true\norg.gradle.parallel=true\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\n' >> android/gradle.properties

      - run: ./gradlew assembleRelease --build-cache
        working-directory: android

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.p12
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks $RUNNER_TEMP/release.p12 --ks-type pkcs12 --ks-pass env:KEYSTORE_PASSWORD \
            --out account.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          $APKSIGNER verify account.apk

      - uses: actions/upload-artifact@v6
        with:
          name: account-apk
          path: account.apk

      # בהערות הגרסה: versionCode ו-sha256 של ה-APK. האפליקציה משווה לפי ה-versionCode ובודקת את הקובץ שירד מול ה-sha256.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.$VERSION_CODE"
          SHA=$(sha256sum account.apk | cut -d' ' -f1)
          NOTES=$(printf 'versionCode: %s\nsha256: %s\n\nAPK חתום. מותקן מעל גרסה קודמת ומתעדכן מתוך האפליקציה.' "$VERSION_CODE" "$SHA")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" account.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" account.apk --title "גרסה 1.0.$VERSION_CODE" --notes "$NOTES"
          fi
